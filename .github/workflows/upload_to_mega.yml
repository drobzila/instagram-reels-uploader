name: Upload Videos to MEGA

on:
  schedule:
    - cron: '0 6 * * *' # كل يوم الساعة 6 صباحًا UTC
  workflow_dispatch:

jobs:
  upload_to_mega:
    runs-on: ubuntu-22.04

    env:
      SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
      FOLDER_ID: ${{ secrets.FOLDER_ID }}
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib mega.py

    - name: Upload videos from Google Drive to MEGA
      run: |
        python scripts/upload_drive_to_mega.py
