name: Download and Release Videos

on:
  workflow_dispatch:

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: Download videos from Google Drive
      run: python download_videos.py

    - name: Create release and upload videos
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v1.0"        # استبدل بالـ Tag الذي تريد
        name: "Release v1.0"    # اسم الـ Release
        files: "videos/*"       # كل ملفات الفيديو في المجلد videos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
