name: Upload Instagram Reels

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # تشغيل كل يوم الساعة 6 صباحًا

jobs:
  upload_reels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set Instagram Environment Variables
      run: |
        echo "ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> $GITHUB_ENV
        echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> $GITHUB_ENV

    - name: Run Instagram Reels Uploader
      run: python main.py
