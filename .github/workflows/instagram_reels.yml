name: Upload Instagram Reels

on:
  workflow_dispatch: # لتشغيله يدوياً
  schedule:
    - cron: '0 6 * * *' # مثال: كل يوم الساعة 6 صباحاً بتوقيت UTC

jobs:
  upload_reels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> .env
        echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env
        echo "GOOGLE_APPLICATION_CREDENTIALS=service_account.json" >> .env

    - name: Add Service Account JSON
      run: |
        echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > service_account.json

    - name: Run Instagram Reels Uploader
      run: |
        python main.py
