name: Upload Instagram Reels

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # تشغيل كل يوم الساعة 6 صباحًا

jobs:
  upload_reels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
       echo "ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> .env
       echo "IG_USER_ID=${{ secrets.IG_USER_ID }}" >> .env
       echo "SERVICE_ACCOUNT_JSON_B64=${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}" >> .env

    - name: Run Instagram Reels Uploader
      run: python main.py
