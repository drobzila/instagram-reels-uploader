name: Upload Drive Videos to Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # يعمل كل 6 ساعات

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install instagrapi gdown

      - name: Run uploader
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python main.py
