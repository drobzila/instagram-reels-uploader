name: Upload Reels

on:
  workflow_dispatch:  # تشغيل يدوي
  schedule:
    - cron: '0 7 * * *' # يوميًا الساعة 07:00 بتوقيت الجزائر

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - run: pip install requests tqdm

    - name: Upload Reels from Release
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        GITHUB_OWNER: drobliza
        GITHUB_REPO: instagram-reels-uploader
      run: |
        python - <<'EOF'
import os, requests, time

ACCESS_TOKEN = os.environ["ACCESS_TOKEN"]
IG_USER_ID = os.environ["IG_USER_ID"]
OWNER = os.environ["GITHUB_OWNER"]
REPO = os.environ["GITHUB_REPO"]

# جلب الفيديوهات من أحدث Release
r = requests.get(f"https://api.github.com/repos/{OWNER}/{REPO}/releases/latest").json()
videos = [a["browser_download_url"] for a in r.get("assets", []) if a["name"].endswith(".mp4")]

def upload(video_url):
    print("🎬 رفع:", video_url)
    container = requests.post(f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media",
                              data={"media_type":"REELS","video_url":video_url,"access_token":ACCESS_TOKEN}).json()
    cid = container.get("id")
    if not cid:
        print("❌ خطأ إنشاء container", container)
        return
    for _ in range(15):
        status = requests.get(f"https://graph.facebook.com/v19.0/{cid}", params={"fields":"status_code","access_token":ACCESS_TOKEN}).json()
        if status.get("status_code")=="READY": break
        time.sleep(10)
    pub = requests.post(f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media_publish",
                        data={"creation_id":cid,"access_token":ACCESS_TOKEN}).json()
    print("✅ تم النشر:", pub)

for v in videos:
    upload(v)
EOF
