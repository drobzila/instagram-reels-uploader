name: Daily Upload Reels from Release

on:
  workflow_dispatch:  # تشغيل يدوي
  schedule:
    - cron: '0 7 * * *' # كل يوم الساعة 07:00 بتوقيت الجزائر (06:00 UTC)

jobs:
  upload-reels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests tqdm

    - name: Upload videos from GitHub Release
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        GITHUB_OWNER: drobliza
        GITHUB_REPO: instagram-reels-uploader
        DAILY_LIMIT: 5
      run: |
        python - <<'EOF'
import os
import requests
import time
from datetime import datetime

ACCESS_TOKEN = os.environ.get("ACCESS_TOKEN")
IG_USER_ID = os.environ.get("IG_USER_ID")
GITHUB_OWNER = os.environ.get("GITHUB_OWNER")
GITHUB_REPO = os.environ.get("GITHUB_REPO")
DAILY_LIMIT = int(os.environ.get("DAILY_LIMIT", 5))
UPLOADED_LOG = ".uploaded_videos.txt"

# تحميل الفيديوهات من أحدث Release
def get_release_videos(owner, repo, tag="latest"):
    url = f"https://api.github.com/repos/{owner}/{repo}/releases/{tag}"
    r = requests.get(url)
    if r.status_code != 200:
        print("❌ فشل الحصول على Release")
        return []
    data = r.json()
    assets = data.get("assets", [])
    return [a["browser_download_url"] for a in assets if a["name"].endswith(".mp4")][:DAILY_LIMIT]

# رفع فيديو إلى Instagram
def create_container(video_url):
    url = f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media"
    payload = {"media_type": "REELS", "video_url": video_url, "access_token": ACCESS_TOKEN}
    r = requests.post(url, data=payload).json()
    if r.get("error"):
        print("❌ خطأ في إنشاء container:", r["error"])
        return None
    return r.get("id")

def check_status(container_id):
    url = f"https://graph.facebook.com/v19.0/{container_id}"
    params = {"fields": "status_code", "access_token": ACCESS_TOKEN}
    r = requests.get(url, params=params).json()
    return r.get("status_code")

def publish(container_id):
    url = f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media_publish"
    payload = {"creation_id": container_id, "access_token": ACCESS_TOKEN}
    r = requests.post(url, data=payload).json()
    return r

def upload_reel(video_url):
    print("\n🎬 رفع الفيديو:", video_url)
    container = create_container(video_url)
    if not container:
        return False
    for attempt in range(15):
        status = check_status(container)
        if status == "READY":
            print("✅ الفيديو جاهز للنشر")
            break
        print(f"⏳ حالة الفيديو: {status}, محاولة {attempt+1}/15")
        time.sleep(10)
    else:
        print("❌ الفيديو لم يصبح جاهزاً بعد الحد الأقصى من المحاولات")
        return False
    result = publish(container)
    print("📌 تم نشر الفيديو:", result)
    return True

# متابعة الفيديوهات المرفوعة لتجنب التكرار
if os.path.exists(UPLOADED_LOG):
    with open(UPLOADED_LOG, "r") as f:
        uploaded = set(line.strip() for line in f)
else:
    uploaded = set()

videos_today = get_release_videos(GITHUB_OWNER, GITHUB_REPO)
print(f"\n✅ عدد الفيديوهات المتاحة اليوم: {len(videos_today)}")

for video_url in videos_today:
    if video_url in uploaded:
        print(f"⚠️ الفيديو تم رفعه مسبقاً، تخطي: {video_url}")
        continue
    success = upload_reel(video_url)
    if success:
        uploaded.add(video_url)
        with open(UPLOADED_LOG, "a") as f:
            f.write(video_url + "\n")
        time.sleep(5)
EOF
