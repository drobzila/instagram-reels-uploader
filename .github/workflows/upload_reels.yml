name: Upload Reels

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - run: pip install requests tqdm

    - name: Upload Reels
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        GITHUB_OWNER: drobliza
        GITHUB_REPO: instagram-reels-uploader
      run: python upload_to_instagram.py
