name: Upload Reels from Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 07:00 صباحًا بتوقيت الجزائر

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: إعداد Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: تثبيت مكتبات Python
      run: pip install tqdm requests

    - name: Install dependencies
      run: |
        pip install google-api-python-client google-auth requests

    - name: Fetch video links
      env:
        SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
      run: python drive.py

    - name: Upload to Instagram
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
      run: python upload_to_instagram.py
