name: Drive → GitHub Release → Instagram Reels

on:
  workflow_dispatch:
  schedule:
    # كل يوم عند 06:30 UTC (07:30 الجزائر)
    - cron: '30 5 * * *'

jobs:
  transfer-and-upload:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ استنساخ الريبو
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ تثبيت المكتبات
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir google-api-python-client google-auth requests tqdm

      # 4️⃣ توليد قائمة الفيديوهات من Drive
      - name: Run drive.py to generate videos.txt
        env:
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          python drive.py
          echo "---- videos.txt ----"
          cat videos.txt || true

      # 5️⃣ تحضير مجلد release_assets
      - name: Prepare release_assets directory
        run: mkdir -p release_assets

      # 6️⃣ تحميل الملفات من Google Drive
      - name: Download files from videos.txt
        run: |
          set -e
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            url="$(echo "$line" | sed 's/  #.*$//g' | xargs)"
            name="$(echo "$line" | awk -F'#' '{print $2}' | xargs)"
            if [ -z "$name" ]; then
              id="$(echo "$url" | grep -o '[-\w]\{25,50\}')"
              name="video_${id}.mp4"
            fi
            out="release_assets/${name}"
            echo "Downloading [$url] -> $out"
            wget -q --tries=3 --timeout=60 -O "$out" "$url" || echo "❌ Failed to download $url"
            i=$((i+1))
          done < videos.txt
          echo "Downloaded $i files:"
          ls -lah release_assets || true

      # 7️⃣ إنشاء Release ورفع الملفات باستخدام Python
      - name: Create Release & Upload assets via Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = "reels-" + datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          headers = {"Authorization": f"token {token}"}

          # إنشاء Release
          r = requests.post(
              f"https://api.github.com/repos/{repo}/releases",
              headers=headers,
              json={"tag_name": tag, "name": tag, "body": "Automated release"}
          )
          release = r.json()
          release_id = release.get("id")
          if not release_id:
              print("❌ Failed to create release:", release)
              exit(1)
          print("Created release:", tag)

          # رفع الملفات
          for f in os.listdir("release_assets"):
              path = os.path.join("release_assets", f)
              if os.path.isfile(path):
                  upload_url = release["upload_url"].split("{")[0]
                  params = {"name": f, "label": f}
                  with open(path, "rb") as file_data:
                      r2 = requests.post(upload_url, headers=headers, params=params, data=file_data)
                  if r2.status_code >= 400:
                      print(f"❌ Failed to upload {f}: {r2.text}")
                  else:
                      print(f"Uploaded {f} successfully")
EOF

      # 8️⃣ تجهيز ملف videos.txt للـ Instagram
      - name: Prepare videos.txt for Instagram upload
        run: |
          rm -f videos_instagram.txt
          idx=0
          for f in release_assets/*; do
            [ -f "$f" ] || continue
            idx=$((idx+1))
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/reels-$(date -u +'%Y%m%dT%H%M%SZ')/${f##*/}"
            echo "$url  # reel_${idx}.mp4" >> videos_instagram.txt
          done
          mv videos_instagram.txt videos.txt
          echo "---- videos.txt for Instagram ----"
          cat videos.txt

      # 9️⃣ رفع الفيديوهات إلى Instagram
      - name: Run upload_to_instagram.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ ! -f upload_to_instagram.py ]; then
            echo "❌ upload_to_instagram.py not found"
            exit 1
          fi
          python upload_to_instagram.py

      # 🔟 الحالة النهائية
      - name: Final status
        run: echo "✅ Workflow finished successfully."
