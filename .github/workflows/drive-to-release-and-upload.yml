name: Drive → GitHub Release → Instagram Reels

on:
  workflow_dispatch:
  schedule:
    # كل يوم عند 06:30 UTC (07:30 بتوقيت الجزائر)
    - cron: '30 5 * * *'

jobs:
  transfer-and-upload:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ استنساخ الريبو
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ تثبيت المكتبات
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir google-api-python-client google-auth requests tqdm

      # 4️⃣ توليد قائمة الفيديوهات من Drive
      - name: Run drive.py to generate videos.txt
        env:
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          python drive.py
          echo "---- videos.txt ----"
          cat videos.txt || true

      # 5️⃣ تحضير مجلد release_assets
      - name: Prepare release_assets directory
        run: mkdir -p release_assets

      # 6️⃣ تحميل الملفات من Google Drive
      - name: Download files from videos.txt
        run: |
          set -e
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            url="$(echo "$line" | sed 's/  #.*$//g' | xargs)"
            name="$(echo "$line" | awk -F'#' '{print $2}' | xargs)"
            if [ -z "$name" ]; then
              # استخراج ID من رابط Google Drive
              id="$(echo "$url" | grep -o '[-\w]\{25,50\}')"
              name="video_${id}.mp4"
            fi
            out="release_assets/${name}"
            echo "Downloading [$url] -> $out"
            wget -q --tries=3 --timeout=60 -O "$out" "$url" || {
              echo "❌ Failed to download $url"
            }
            i=$((i+1))
          done < videos.txt
          echo "Downloaded $i files:"
          ls -lah release_assets || true

      # 7️⃣ تثبيت GitHub CLI
      - name: Install GitHub CLI
        uses: github/gh-action@v2
        with:
          version: latest

      # 8️⃣ إنشاء Release ورفع الملفات
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="reels-$(date -u +'%Y%m%dT%H%M%SZ')"
          TITLE="Reels upload $TAG"
          echo "Creating release $TAG ..."
          gh release create "$TAG" -t "$TITLE" -n "Automated upload of Drive videos" || true

          for f in release_assets/*; do
            [ -f "$f" ] || continue
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --clobber || echo "❌ Failed to upload $f"
          done

          gh release view "$TAG" --json assets -q ".assets[].browser_download_url" > release_urls.txt
          echo "Release URLs:"
          cat release_urls.txt

      # 9️⃣ تجهيز ملف videos.txt للـ Instagram
      - name: Prepare videos.txt for Instagram upload
        run: |
          rm -f videos_instagram.txt
          idx=0
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            idx=$((idx+1))
            echo "$url  # reel_${idx}.mp4" >> videos_instagram.txt
          done < release_urls.txt
          echo "---- videos_instagram.txt ----"
          cat videos_instagram.txt
          mv videos_instagram.txt videos.txt

      # 10️⃣ رفع الفيديوهات إلى Instagram
      - name: Run upload_to_instagram.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ ! -f upload_to_instagram.py ]; then
            echo "❌ upload_to_instagram.py not found"
            exit 1
          fi
          python upload_to_instagram.py

      # 11️⃣ الحالة النهائية
      - name: Final status
        run: echo "✅ Workflow finished successfully."
