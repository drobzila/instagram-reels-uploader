name: Upload Reels from Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"   # كل 4 ساعات

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run uploader
        run: python main.py
