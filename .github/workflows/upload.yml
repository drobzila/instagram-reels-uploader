name: Upload Daily Videos to Mega

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Mega CMD
        run: |
          sudo apt-get update
          sudo apt-get install -y megacmd

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install google-api-python-client google-auth

      - name: Save Mega session
        run: |
          echo "${{ secrets.MEGA_SESSION }}" > mega_session.txt
          mega-login --session $(cat mega_session.txt)

      - name: Download from Drive & upload to Mega
        run: |
          python upload_to_mega_with_cmd.py
        env:
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
