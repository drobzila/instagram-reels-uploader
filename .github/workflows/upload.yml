name: Upload Videos to MEGA

on:
  schedule:
    - cron: '0 6 * * *' # كل يوم الساعة 6 صباحًا UTC
  workflow_dispatch:

jobs:
  upload_to_mega:
    runs-on: ubuntu-22.04

    env:
      SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
      FOLDER_ID: ${{ secrets.FOLDER_ID }}
      MEGA_SESSION: ${{ secrets.MEGA_SESSION }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib mega.py

    - name: Install MEGAcmd
      run: |
        sudo apt-get update
        sudo apt-get install -y lsb-release gnupg wget
        sudo install -m 0755 -d /etc/apt/keyrings
        wget -O - https://mega.nz/linux/repo/xUbuntu_jammy/Release.key | gpg --dearmor | sudo tee /etc/apt/keyrings/megacmd.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/megacmd.gpg] https://mega.nz/linux/repo/xUbuntu_jammy/ ./" | sudo tee /etc/apt/sources.list.d/megacmd.list
        sudo apt-get update
        sudo apt-get install -y megacmd

    - name: Save MEGA session
      run: |
        echo "$MEGA_SESSION" > mega_session.txt
        mega-login --session "$(cat mega_session.txt)"

    - name: Upload videos from Drive to MEGA
      run: |
        python scripts/upload_drive_to_mega.py
