name: Upload Instagram Reels

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # تشغيل يوميًا عند منتصف الليل، يمكن تعديله

jobs:
  upload_reels:
    runs-on: ubuntu-latest

    env:
      SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi gdown google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create session.json from Base64
        run: |
          echo "${{ secrets.IG_SESSION_B64 }}" | base64 --decode > session.json

      - name: Ensure videos directory exists
        run: mkdir -p videos

      - name: Download video links from Drive
        run: python download_drive_videos.py

      - name: Run main script to upload Reels
        run: python main.py
