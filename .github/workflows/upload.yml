name: Upload Daily Videos to Mega

on:
  workflow_dispatch:   # لتشغيله يدويًا
  schedule:
    - cron: '0 12 * * *'  # يوميًا الساعة 12:00 UTC

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mega.py google-api-python-client google-auth

      - name: Run upload script
        run: python upload_to_mega.py
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
