name: Upload Daily Videos to Mega

on:
  workflow_dispatch:   # تشغيل يدوي
  schedule:
    - cron: '0 12 * * *'  # يوميًا الساعة 12:00 UTC

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install MEGA CMD
        run: |
          wget https://mega.nz/linux/MEGAsync/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get -f install -y

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install google-api-python-client google-auth

      - name: Save Mega session
        run: |
          echo "${{ secrets.MEGA_SESSION }}" > mega_session.txt
          mega-login --session $(cat mega_session.txt)

      - name: Run upload script
        run: python upload_to_mega_with_cmd.py
        env:
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
