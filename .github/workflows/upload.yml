name: Upload Videos to MEGA

on:
  schedule:
    - cron: '0 6 * * *' # كل يوم الساعة 6 صباحًا UTC
  workflow_dispatch:

jobs:
  upload_to_mega:
    runs-on: ubuntu-22.04

    env:
      SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
      FOLDER_ID: ${{ secrets.FOLDER_ID }}
      MEGA_SESSION: ${{ secrets.MEGA_SESSION }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib mega.py

    - name: Install MEGAcmd via Snap
      run: |
        sudo apt-get update
        sudo apt-get install -y snapd
        sudo snap install mega-cmd --classic

    - name: Login to MEGA using Session Key
      run: |
        export PATH=$PATH:/snap/bin
        echo "$MEGA_SESSION" > mega_session.txt
        mega-login --session "$(cat mega_session.txt)"

    - name: Upload videos from Google Drive to MEGA
      run: |
        export PATH=$PATH:/snap/bin
        python scripts/upload_drive_to_mega.py
